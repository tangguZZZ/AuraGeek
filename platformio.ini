; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; VS Code sets a user-level PLATFORMIO_CORE_DIR. Isolate only the package
; stores that pioarduino can replace, while retaining the official CLI/Home.
platforms_dir = .pio-core/platforms
packages_dir = .pio-core/packages
cache_dir = .pio-core/cache

[env:esp32-s3-devkitc-1]
; Arduino 3.3.11 provides the official USBAudioCard implementation (UAC1 on S3).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
	pre:tools/embed_portal.py
	post:tools/prepare_voice_model.py
board_build.partitions = partitions_aurageek.csv
build_src_filter = +<*> -<ui/resources/ag_face_*.c>
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -D ARDUINO_USB_MODE=1
build_flags =
	-I include
	-include board/TftSetup.h
	-D BOARD_HAS_PSRAM
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_LVGL_H_INCLUDE_SIMPLE=1
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_LOOP_STACK_SIZE=16384
	-D AURAGEEK_BENCH_COMMANDS=1
	-Wl,--wrap=esp_mbedtls_mem_calloc
	-Wl,--wrap=esp_mn_commands_add
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit AHTX0@^2.0.6
	bblanchon/ArduinoJson@^7.2.2
	ruiseixasm/Versatile_RotaryEncoder@^1.3.1
	lvgl/lvgl@9.5.0
	https://github.com/pschatzmann/codec-opus.git#dc1920f17c947d4bb3ddc52e99e94a45dd343a19
